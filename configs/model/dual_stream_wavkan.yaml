# Dual-Stream + wav-KAN Configuration (Phase 3)
# 完整架构：双流时频编码器 + wav-KAN 投影头

_target_: src.models.encoders.dual_stream_encoder.build_dual_stream_encoder

# 时域流配置
time_stream:
  n_samples: 10000
  cnn_config:
    in_channels: 1
    out_channels: [32, 64, 128]
    kernel_sizes: [25, 25, 3]
    strides: [4, 4, 1]
    use_batchnorm: true
    dropout: 0.1
  mamba_config:
    d_model: 128
    d_state: 16
    d_conv: 4
    expand: 2
    n_layers: 4
    dropout: 0.1
    bidirectional: true
    bi_fusion_mode: concat

# 频域流配置
freq_stream:
  n_mels: 64
  n_frames: 500
  patch_width: 4
  embed_dim: 128
  n_layers: 4
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1
  bidirectional: true
  bi_fusion_mode: concat

# GMU 融合
fusion:
  mode: gmu
  upsample_kernel: 5
  dropout: 0.1

# wav-KAN 投影头
projection:
  type: wavkan
  hidden_dim: 1024
  output_dim: 128
  num_layers: 2
  wavelet_type: morlet  # morlet, mexican_hat, dog, shannon

use_gap: true
