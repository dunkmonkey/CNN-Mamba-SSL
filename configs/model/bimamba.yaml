# Bidirectional Mamba Configuration (Phase 1 Ablation)
# 双向 Mamba 编码器配置：用于消融实验 A1

_target_: src.models.encoders.hybrid_encoder.HybridEncoder

# CNN Frontend Configuration
cnn_config:
  in_channels: 1
  out_channels: [32, 64, 128]
  kernel_sizes: [25, 25, 3]
  strides: [4, 4, 1]
  use_batchnorm: true
  dropout: 0.1

# Mamba Backend Configuration - 双向
mamba_config:
  d_model: 128
  d_state: 16
  d_conv: 4
  expand: 2
  n_layers: 4
  dropout: 0.1
  bidirectional: true  # 启用双向 Mamba

# Projection Head Configuration
projection_config:
  input_dim: 128
  hidden_dim: 512
  output_dim: 128
  num_layers: 2

use_gap: true

# 元信息
_metadata_:
  phase: 1
  ablation: A1
  description: "Bidirectional Mamba for ablation study"
  comparison: "uni-mamba vs bi-mamba"
