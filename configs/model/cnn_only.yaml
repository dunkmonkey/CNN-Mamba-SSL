# CNN-only encoder (for ablation study)

_target_: src.models.encoders.cnn_encoder.CNNEncoder

in_channels: 1
out_channels: [32, 64, 128, 256]  # Deeper CNN to compensate
kernel_sizes: [16, 8, 4, 4]
strides: [2, 2, 2, 2]
use_batchnorm: true
dropout: 0.1
use_gap: true

# Projection Head
projection_config:
  input_dim: 256
  hidden_dim: 128
  output_dim: 128
  num_layers: 2
