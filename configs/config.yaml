# Main configuration file for CNN-Mamba-SSL project
# This uses Hydra's composition pattern to assemble config from multiple sources

defaults:
  - model: cnn_mamba
  - data: physionet2016
  - trainer: pretrain
  - optimizer: adam
  - augmentation: pcg_augmentations
  - _self_

# Seed for reproducibility
seed: 42

# Paths
data_dir: ${oc.env:PWD}/dataset
output_dir: ${oc.env:PWD}/outputs
log_dir: ${oc.env:PWD}/logs

# Hydra configuration
hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${output_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
