# Baseline Pretraining Experiment

# @package _global_

defaults:
  - override /model: cnn_mamba
  - override /data: physionet2016
  - override /trainer: pretrain
  - override /optimizer: adam

# Experiment name
experiment_name: exp001_baseline_moco

# MoCo-specific parameters
moco:
  queue_size: 65536
  momentum: 0.999
  temperature: 0.07

# Override some default settings
trainer:
  trainer:
    max_epochs: 200
    
data:
  batch_size: 64

optimizer:
  lr: 0.001

# Random seed
seed: 42
