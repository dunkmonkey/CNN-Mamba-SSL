# Strong Augmentation Configuration (Phase 2 Ablation B1)
# 强增强策略：较高的应用概率和较大的变换幅度

# 时域增强
gaussian_noise:
  enabled: true
  prob: 0.7
  std_range: [0.01, 0.03]

time_shift:
  enabled: true
  prob: 0.7
  shift_range: [-0.3, 0.3]

amplitude_scaling:
  enabled: true
  prob: 0.7
  scale_range: [0.7, 1.3]

time_warping:
  enabled: true
  prob: 0.5
  warp_range: [0.9, 1.1]

time_masking:
  enabled: true
  prob: 0.5
  mask_ratio_range: [0.1, 0.2]
  num_masks: 3

lowpass_filter:
  enabled: true
  prob: 0.7
  cutoff_freq_range: [150, 500]
  filter_order: 5

# 频域增强 (SpecAugment)
spec_augment:
  enabled: true
  freq_mask_param: 30
  time_mask_param: 60
  num_freq_masks: 3
  num_time_masks: 3
  prob: 0.7

# 组合设置
random_compose: true
max_augmentations: 5

# 元信息
_metadata_:
  phase: 2
  ablation: B1
  strength: strong
  description: "Strong augmentation for ablation study"
