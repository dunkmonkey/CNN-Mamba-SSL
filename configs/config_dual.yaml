# Dual-Stream Pretraining Configuration
# For Phase 3: Time-Frequency Fusion with wav-KAN

defaults:
  - model: dual_stream_wavkan
  - data: physionet2016_dual
  - trainer: pretrain
  - optimizer: adam
  - augmentation: mixed
  - _self_

# Seed for reproducibility
seed: 42

# Paths
data_dir: ${oc.env:PWD}/dataset
output_dir: ${oc.env:PWD}/outputs
log_dir: ${oc.env:PWD}/logs

# MoCo Configuration
moco:
  queue_size: 65536
  momentum: 0.999
  temperature: 0.07

# Learning Rate Scheduler
scheduler:
  T_max: 300
  eta_min: 1.0e-6

# W&B Logger
logger:
  wandb:
    _target_: lightning.pytorch.loggers.WandbLogger
    project: CNN-Mamba-SSL
    name: dual_stream_${now:%Y%m%d_%H%M%S}
    save_dir: ${log_dir}
    log_model: true
    group: phase3_dual_stream
    tags: [dual_stream, gmu, wavkan, moco]

# Hydra configuration
hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${output_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
